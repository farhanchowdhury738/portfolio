<section class="scroll-mt-24" id="projects">
  <!-- ==========================================================
       PROJECT SECTION HEADER
  ========================================================== -->

 <div class="mb-12">
  <div class="sticky top-24 z-40">
    <div class="relative w-fit">
      <select
        id="project-category"
        class="appearance-none rounded-xl border border-zinc-300 bg-white/80 px-4 py-2.5 pr-10 text-sm font-medium text-zinc-800 shadow-sm backdrop-blur-md transition hover:border-zinc-400 focus:border-indigo-400 focus:outline-none focus:ring-1 focus:ring-indigo-400/30 dark:border-zinc-700/60 dark:bg-zinc-900/60 dark:text-zinc-200 dark:hover:border-zinc-600"
      >
        <option value="featured">Featured Projects</option>
        <option value="all">All Projects</option>
      </select>

      <i
        class="pointer-events-none absolute right-3 top-1/2 h-4 w-4 -translate-y-1/2 text-zinc-500 dark:text-zinc-400"
        data-lucide="chevron-down"
      ></i>
    </div>
  </div>
</div>

  <!-- ==========================================================
       PROJECT GRID / CONTAINER
  ========================================================== -->

  <div class="grid gap-5 md:grid-cols-2" id="projectsGrid"></div>

  <!-- ==========================================================
       MOBILE VIEW ALL BUTTON
       ----------------------------------------------------------
       The desktop View All button is hidden on small screens.

       This button is shown only on mobile using:
       sm:hidden

       JavaScript uses this ID:
       #viewAllProjectsMobile
  ========================================================== -->

  <div class="mt-8 text-center sm:hidden">
    <button
      class="text-sm font-semibold text-zinc-500 transition hover:text-indigo-500"
      id="viewAllProjectsMobile"
      type="button"
    >
      View all →
    </button>
  </div>
</section>
