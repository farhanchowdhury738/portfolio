<section class="scroll-mt-24" id="projects">

  <!-- ==========================================================
       PROJECT SECTION HEADER
  ========================================================== -->

  <div class="mb-10 flex items-end justify-between gap-5">

    <div>
      <!-- Main section title -->
      <h2 class="mt-2 text-3xl font-bold tracking-tight sm:text-4xl">
        Featured Projects
      </h2>
    </div>

    <!-- ========================================================
         DESKTOP VIEW ALL BUTTON
         --------------------------------------------------------
         Hidden on mobile using "hidden sm:block".

         JavaScript uses this ID:
         #viewAllProjects

         Clicking it shows/hides the projects that are initially
         hidden because their "featured" value is false.
    ======================================================== -->

    <button
      class="hidden text-sm font-semibold text-zinc-500 transition hover:text-indigo-500 sm:block"
      id="viewAllProjects"
      type="button"
    >
      View all →
    </button>

  </div>


  <!-- ==========================================================
       PROJECT GRID / CONTAINER
  ========================================================== -->

  <div
    class="grid gap-5 md:grid-cols-2"
    id="projectsGrid"
  ></div>


  <!-- ==========================================================
       MOBILE VIEW ALL BUTTON
       ----------------------------------------------------------
       The desktop View All button is hidden on small screens.

       This button is shown only on mobile using:
       sm:hidden

       JavaScript uses this ID:
       #viewAllProjectsMobile
  ========================================================== -->

  <div class="mt-8 text-center sm:hidden">

    <button
      class="text-sm font-semibold text-zinc-500 transition hover:text-indigo-500"
      id="viewAllProjectsMobile"
      type="button"
    >
      View all →
    </button>

  </div>

</section>
