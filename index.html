<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Farhan Chowdhury</title>

    <!-- Apply saved / system theme BEFORE first paint (prevents dark-mode flash) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          var dark =
            t === "dark" ||
            (t === null &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>

    <!-- Makes native controls (dropdown list, scrollbars) follow the site theme -->
    <meta name="color-scheme" content="light dark" />
    <style>
      html { color-scheme: light; }
      html.dark { color-scheme: dark; }
    </style>

    <meta
      name="description"
      content="Farhan Chowdhury's personal developer portfolio."
    />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      tailwind.config = {
        darkMode: "class",

        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>

  <body
    class="bg-zinc-50 text-zinc-900 antialiased transition-colors duration-300 dark:bg-zinc-950 dark:text-zinc-100"
  >
    <div class="min-h-screen">
      <!-- Navbar -->
      <div id="navbar"></div>

      <!-- ==========================================
           MAIN PORTFOLIO LAYOUT
           ========================================== -->
      <main
        class="mx-auto grid max-w-7xl gap-8 px-5 pb-8 pt-24 lg:grid-cols-[280px_minmax(0,1fr)] lg:px-8 lg:pb-10 lg:pt-28"
      >
        <!-- ========================================
             SIDEBAR
             Mobile  : AFTER main content
             Desktop : LEFT SIDE
             ======================================== -->
        <div id="sidebar" class="order-2 lg:order-1"></div>

        <!-- ========================================
             MAIN CONTENT
             Mobile  : BEFORE sidebar
             Desktop : RIGHT SIDE
             ======================================== -->
        <div id="main-content" class="min-w-0 order-1 lg:order-2">
          <!-- Home -->
          <div id="home-section"></div>

          <!-- About -->
          <div id="about-section"></div>

          <!-- Projects -->
          <div id="projects-section"></div>

          <!-- Resume -->
          <div id="resume-section"></div>

          <!-- Blog -->
          <div id="blog-section"></div>

          <!-- Contact -->
          <div id="contact-section"></div>
        </div>
      </main>

      <!-- Footer -->
      <div id="footer"></div>
    </div>

    <!-- Main JavaScript -->
    <script src="js/main.js"></script>
  </body>
</html>
